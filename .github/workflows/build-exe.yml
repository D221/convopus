name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # needed only to upload the asset when this runs for a release
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build exe
        run: uv run --with pyinstaller pyinstaller build.spec --noconfirm --log-level WARN

      - name: Smoke test
        run: ./dist/convopus.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: convopus-windows-x64
          path: dist/convopus.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          cp dist/convopus.exe "dist/convopus-${version}-windows-x64.exe"
          gh release upload "$TAG" "dist/convopus-${version}-windows-x64.exe" --clobber