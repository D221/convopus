version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    groups:
      # Dev tooling bumps (pytest, pytest-cov, ruff, ty) arrive as one PR.
      # Major bumps are left out so they stay individual PRs for review.
      dev-dependencies:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "ruff"
          - "ty"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5